resources:
  jobs:
    batch_inference_job:
      name: "LLMOps - 3. Batch Inference [${var.environment}]"
      description: "Runs the Champion model over the input table and writes predictions to a results table."

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - "pyyaml"

      parameters:
        - name: catalog_name
          default: "${var.catalog_name}"
        - name: schema_name
          default: "${var.schema_name}"
        - name: model_name
          default: "${var.model_name}"
        - name: bundle_root
          default: "${workspace.root_path}/files"

      tasks:
        - task_key: batch_inference
          environment_key: default
          notebook_task:
            notebook_path: "../pipelines/batch_inference.py"
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              model_name: "{{job.parameters.model_name}}"
              bundle_root: "{{job.parameters.bundle_root}}"

      timeout_seconds: 3600
      max_concurrent_runs: 1
      tags:
        Project: llmops-quickstart
        Environment: "${var.environment}"
