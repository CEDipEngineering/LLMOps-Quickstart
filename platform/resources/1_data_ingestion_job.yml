resources:
  jobs:
    data_ingestion_job:
      name: "LLMOps - 1. Data Ingestion [${var.environment}]"
      description: "Runs the developer-owned evaluation data notebook to create the eval dataset."

      environments:
        - environment_key: default
          spec:
            environment_version: "5"

      parameters:
        - name: catalog_name
          default: "${var.catalog_name}"
        - name: schema_name
          default: "${var.schema_name}"

      tasks:
        - task_key: data_ingestion
          environment_key: default
          notebook_task:
            notebook_path: "../../developer/eval/eval_data.py"
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"

      timeout_seconds: 1800
      max_concurrent_runs: 1
      tags:
        Project: llmops-quickstart
        Environment: "${var.environment}"
