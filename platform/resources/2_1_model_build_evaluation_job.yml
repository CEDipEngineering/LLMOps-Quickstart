resources:
  jobs:
    model_build_evaluation_job:
      name: "LLMOps - 2.1 Model Build & Evaluation [${var.environment}]"
      description: "Logs the agent to MLflow, evaluates it, and promotes to Champion if the accuracy threshold is met."

      # databricks-agents, mlflow, databricks-sdk, and pydantic are all included in Env v5.
      # databricks-openai and pyyaml are added here.
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - "databricks-openai"
              - "pyyaml"

      parameters:
        - name: catalog_name
          default: "${var.catalog_name}"
        - name: schema_name
          default: "${var.schema_name}"
        - name: model_name
          default: "${var.model_name}"
        - name: llm_endpoint
          default: "${var.llm_endpoint}"
        - name: experiment_name
          default: "${resources.experiments.llmops_experiment.name}"
        - name: bundle_root
          default: "${workspace.root_path}/files"

      tasks:
        - task_key: model_build
          environment_key: default
          notebook_task:
            notebook_path: "../pipelines/model_build.py"
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              model_name: "{{job.parameters.model_name}}"
              llm_endpoint: "{{job.parameters.llm_endpoint}}"
              experiment_name: "{{job.parameters.experiment_name}}"
              bundle_root: "{{job.parameters.bundle_root}}"

        - task_key: model_evaluation
          depends_on:
            - task_key: model_build
          environment_key: default
          notebook_task:
            notebook_path: "../pipelines/model_evaluation.py"
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              model_name: "{{job.parameters.model_name}}"
              experiment_name: "{{job.parameters.experiment_name}}"
              logged_run_id: "{{tasks.model_build.values.logged_run_id}}"
              bundle_root: "{{job.parameters.bundle_root}}"

      timeout_seconds: 3600
      max_concurrent_runs: 1
      tags:
        Project: llmops-quickstart
        Environment: "${var.environment}"
